# Docker Compose cho TaleX AI Service
# Chạy: docker-compose up --build
# Dừng: docker-compose down
# Logs: docker-compose logs -f

services:
  # === Container 1: Python AI App ===
  app:
    build: .
    ports:
      - "8000:8000"
    # VPS chỉ có 5.8GB RAM chia cho nhiều service (BE+Postgres+QuestDB, AI+Milvus) — không
    # giới hạn thì container này có thể phình không kiểm soát khi nhiều video/ảnh được xử lý
    # đồng thời (tới 8 job song song, mỗi video còn tốn thêm RAM giải mã FFmpeg), làm cạn RAM
    # cả máy chủ và kéo sập luôn các container khác. Đặt trần để nếu có vượt, chỉ container
    # này bị Docker tự kill + tự restart (restart: unless-stopped), không ảnh hưởng container khác.
    mem_limit: 2g
    # VPS chỉ có 4 core — FFmpeg giải mã video tốn CPU nặng, nếu không giới hạn, nhiều video
    # xử lý cùng lúc có thể chiếm hết CPU, làm BE/Postgres/QuestDB phản hồi chậm hẳn dù RAM
    # vẫn ổn (đây là vấn đề khác với mem_limit ở trên — CPU chỉ làm chậm, không làm sập/kill,
    # nhưng vẫn cần chặn để không "nuốt" hết CPU của container khác). 2.0 = tối đa 2 core.
    cpus: 2.0
    env_file:
      - .env
    environment:
      # Log theo giờ Việt Nam thay vì UTC mặc định của container — dễ đối chiếu log
      # lúc test local với thời điểm thao tác thật trên FE.
      - TZ=Asia/Ho_Chi_Minh
      # Override for Docker internal networking
      - MILVUS_HOST=milvus
    volumes:
      # Mount source code → sửa code không cần rebuild
      - .:/app
      # Giữ ChromaDB data khi restart
      - chroma_data:/app/chroma_data
      # Giữ logs
      - app_logs:/app/logs
    # Cert Kafka (ca.pem/service.cert/service.key) được deploy.yml ghi thẳng ra thư mục
    # certs/ trên host TRƯỚC khi container chạy (giống cách BE làm) — không nhét PEM
    # dài vào .env để Docker Compose tự parse, vì .env parser của Compose không xử lý
    # nổi value dài chứa \n (đã gặp lỗi thật: "unexpected character in variable name").
    # certs/ được mount qua volume .:/app nên container thấy file ngay, không cần
    # entrypoint tự ghi lại.
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    # Cho consumer đủ thời gian gửi LeaveGroup sạch tới Aiven Kafka trước khi bị kill —
    # thiếu cái này, mỗi lần restart/deploy container cũ thành "zombie member" còn giữ
    # quyền sở hữu partition tới khi hết session timeout, khiến message rơi vào đúng
    # partition đó bị treo chờ rebalance (đã gặp thật lúc test local, xem docs debug).
    stop_grace_period: 20s

  # === Container 2: Milvus Vector Database ===
  milvus:
    image: milvusdb/milvus:v2.5.10
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      COMMON_STORAGETYPE: "local"
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  chroma_data:
  app_logs:
  milvus_data:
