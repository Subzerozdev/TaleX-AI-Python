name: Deploy AI Service to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            # Thiếu set -e trước đây: nếu git pull lỗi (vd xung đột với file sửa tay trên
            # VPS), script vẫn chạy tiếp và build lại đúng code CŨ — cùng lớp lỗi với
            # docker-compose-fail đã vá bên dưới ("job xong trong 13s, container không hề
            # restart"), chỉ khác ở bước git pull thay vì docker build.
            cd ~/TaleX-AI-Python || git clone ${{ secrets.REPO_URL }} ~/TaleX-AI-Python && cd ~/TaleX-AI-Python
            git pull origin main

            # Ghi cert Kafka thẳng ra file PEM thật trên host — certs/ được mount qua volume
            # .:/app nên container thấy file ngay, không cần entrypoint tự ghi lại.
            # QUAN TRỌNG: secret phải ở dạng PEM nhiều dòng tự nhiên (mỗi dòng ~64 ký tự),
            # KHÔNG được nén thành 1 dòng dài kèm \n — dòng dài (2000+ ký tự) bị chính kết
            # nối SSH của appleboy/ssh-action tự bẻ xuống dòng giữa chừng (PTY line-wrap),
            # làm hỏng PEM (đã xảy ra thật: "-----BEGIN" và "CERTIFICATE-----" bị tách làm
            # đôi). PEM nhiều dòng ngắn tránh được vấn đề này vì không dòng nào đủ dài để bị wrap.
            mkdir -p certs
            cat > certs/ca.pem << 'CAEOF'
            ${{ secrets.KAFKA_CA_CERT }}
            CAEOF
            cat > certs/service.cert << 'CERTEOF'
            ${{ secrets.KAFKA_ACCESS_CERT }}
            CERTEOF
            cat > certs/service.key << 'KEYEOF'
            ${{ secrets.KAFKA_ACCESS_KEY }}
            KEYEOF
            sed -i 's/^[[:space:]]*//' certs/ca.pem certs/service.cert certs/service.key

            # Create .env from GitHub Secrets
            cat > .env << ENVEOF
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
            APP_HOST=0.0.0.0
            APP_PORT=8000
            CHROMA_PERSIST_DIR=./chroma_data
            RATE_LIMIT_CHAT=10/minute
            RATE_LIMIT_SEARCH=30/minute
            MILVUS_HOST=milvus
            MILVUS_PORT=19530
            FINGERPRINT_FPS=1
            FINGERPRINT_SIMILARITY_THRESHOLD=0.85
            FINGERPRINT_MIN_MATCH_SECONDS=5
            KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
            KAFKA_CONSUMER_GROUP=${{ secrets.KAFKA_CONSUMER_GROUP }}
            KAFKA_TOPIC_SUFFIX=${{ secrets.KAFKA_TOPIC_SUFFIX }}
            KAFKA_SSL_CAFILE=/app/certs/ca.pem
            KAFKA_SSL_CERTFILE=/app/certs/service.cert
            KAFKA_SSL_KEYFILE=/app/certs/service.key
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            REKOGNITION_CONFIDENCE_THRESHOLD=80.0
            REKOGNITION_MAX_FRAMES=30
            MODERATION_FRAME_INTERVAL=2.0
            MONGO_URI=${{ secrets.MONGO_URI }}
            MONGO_DB_NAME=${{ secrets.MONGO_DB_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            ENVEOF

            sed -i 's/^[[:space:]]*//' .env

            # Cleanup old images
            docker image prune -af --filter "until=48h" 2>/dev/null || true

            # Build and start
            # Nếu docker compose không parse nổi .env (vd cert lỗi format) thì phải fail rõ
            # ràng ở đây — nếu không, script chạy tiếp xuống health check, health check pass
            # nhờ container CŨ vẫn đang chạy khỏe, và cả job báo "success" dù thực chất chưa
            # hề redeploy gì (đã xảy ra thật: job xong trong 13s, container không hề restart).
            COMPOSE_DOCKER_CLI_BUILD=1 DOCKER_BUILDKIT=1 \
              docker compose up --build -d || { echo "docker compose up FAILED"; exit 1; }

            # Post-build cleanup
            docker image prune -f 2>/dev/null || true

            # Health check — wait up to 120s
            echo "Waiting for AI service health check..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "AI service is healthy after $((i*5))s!"
                exit 0
              fi
              sleep 5
            done
            # Lệnh cuối trước đây là echo (luôn exit 0) — CI báo xanh dù health check thật
            # sự timeout. exit 1 để CI báo đỏ đúng.
            echo "WARNING: AI service health check failed after 120s"
            exit 1
